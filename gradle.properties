# Match Java launcher @argfile encoding on Windows with Chinese workspace paths.
# JDK 18+ COMPAT uses the native charset; source encoding remains explicitly UTF-8.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=COMPAT
android.useAndroidX=true
android.nonTransitiveRClass=true
# The workspace path contains non-ASCII characters; AGP's path check rejects it by default.
android.overridePathCheck=true
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=2
